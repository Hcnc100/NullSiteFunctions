name: Validate and deploy notifications
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '.github/scripts/**'
      - '.github/workflows/deploy-notifications.yml'
      - '.github/workflows/rollback-retained.yml'
      - '.github/workflows/sync-retention.yml'
      - '.github/workflows/retention-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notifications-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test image retention safeguards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*retention*.py'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions test
      - run: npm --prefix functions audit --audit-level=high
      - run: node --check functions/index.mjs
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm --prefix functions ci
      - uses: google-github-actions/auth@v3
        with:
          project_id: nullpointer-716ae
          workload_identity_provider: projects/646388363945/locations/global/workloadIdentityPools/github-actions/providers/nullsitenotifications
          service_account: github-notify-deploy@nullpointer-716ae.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Gate release on native image retention
        run: python3 .github/scripts/retention_guard.py --project nullpointer-716ae --service notifyemailv2
      - name: Capture notification image before deployment
        run: python3 .github/scripts/artifact_retention.py capture --project nullpointer-716ae --region us-central1 --service notifyemailv2 --state "$RUNNER_TEMP/retention-notify.json"
      - run: npx --yes firebase-tools@15.22.1 deploy --only functions:notifyEmailV2 --project nullpointer-716ae --non-interactive
      - name: Protect active and previous notification image
        run: python3 .github/scripts/artifact_retention.py sync --project nullpointer-716ae --region us-central1 --service notifyemailv2 --state "$RUNNER_TEMP/retention-notify.json"
      - name: Verify retention after successful release
        run: python3 .github/scripts/retention_guard.py --project nullpointer-716ae --service notifyemailv2
