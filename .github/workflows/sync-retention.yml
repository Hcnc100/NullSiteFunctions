name: Verify image retention without deploying
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: notifications-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -B -m unittest discover -s .github/scripts -p 'test_artifact_retention.py'
  sync:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: nullpointer-716ae
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          project_id: nullpointer-716ae
          workload_identity_provider: projects/646388363945/locations/global/workloadIdentityPools/github-actions/providers/nullsitenotifications
          service_account: github-notify-deploy@nullpointer-716ae.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Capture existing active image
        run: python3 .github/scripts/artifact_retention.py capture --project "$PROJECT_ID" --region us-central1 --service notifyemailv2 --state "$RUNNER_TEMP/retention-check.json"
      - name: Synchronize protection without changing traffic
        run: python3 .github/scripts/artifact_retention.py sync --project "$PROJECT_ID" --region us-central1 --service notifyemailv2 --state "$RUNNER_TEMP/retention-check.json"
